# Enable mouse mode
set -g mouse on

# Scrollback
set-option -g history-limit 5000

# Copy from tmux to host
set-option -g set-clipboard on
set-window-option -g mode-keys vi
# Bind 'y' to copy selected text to the system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -selection clipboard"

# Detach from the session with Ctrl-g, the key ./run used to bind for
# `podman attach --detach-keys` (so muscle memory keeps working). bind-key
# has no -g flag: the root key table is what makes it work without a prefix.
bind -T root C-g detach-client
